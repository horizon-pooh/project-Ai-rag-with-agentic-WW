# โครงเท่านั้น ยังไม่ได้ทดสอบ
# service ตาม docs/Line_ai_bot.md หัวข้อ Stack; secret อยู่ใน .env (ดู .env.example) ห้ามใส่ในไฟล์นี้

services:
  caddy:
    # HTTPS สำหรับ webhook (หรือใช้ Cloudflare Tunnel แทน — ยังไม่ตัดสิน)
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    # volumes: Caddyfile + caddy_data (ยังไม่มี Caddyfile)
    depends_on:
      - api

  api:
    build: .
    # command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    # command: arq app.worker.settings.WorkerSettings
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    # คิวอย่างเดียว (ความจริงทั้งหมดอยู่ใน Postgres)
    image: redis:7

  minio:
    image: minio/minio
    command: server /data
    env_file: .env
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
