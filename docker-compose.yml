# โครงเท่านั้น ยังไม่ได้ทดสอบ
# service ตาม docs/Line_ai_bot.md หัวข้อ Stack; secret อยู่ใน .env (ดู .env.example) ห้ามใส่ในไฟล์นี้

services:
  caddy:
    # HTTPS สำหรับ webhook (หรือใช้ Cloudflare Tunnel แทน — ยังไม่ตัดสิน)
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    # ไม่ใช้ env_file .env: caddy ไม่ต้องเห็น secret ของ app ส่งเฉพาะ DOMAIN
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ใบรับรอง ต้องเก็บไว้ ไม่งั้นขอใหม่ทุกครั้งแล้วโดน Let's Encrypt จำกัดจำนวน
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: .
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    # ภายในเท่านั้น ไม่เปิดพอร์ตออก host (ข้างนอกเข้าผ่าน caddy)
    expose:
      - "8000"
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: arq app.worker.settings.WorkerSettings
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    # คิวอย่างเดียว (ความจริงทั้งหมดอยู่ใน Postgres)
    image: redis:7

  minio:
    image: minio/minio
    command: server /data
    env_file: .env
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
